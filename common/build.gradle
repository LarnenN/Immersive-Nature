architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/immersive_nature.accesswidener")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation("maven.modrinth:moonlight:1.20-2.16.0-fabric")
    modImplementation "dev.emi:emi-xplat-intermediary:${rootProject.emi_version}:api"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.mod_id
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/releases"
        }
    }
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases" }
}

apply from: rootProject.file("gradle/minify-json.gradle")
