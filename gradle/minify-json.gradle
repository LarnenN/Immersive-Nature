// Immersive Nature: strip whitespace from JSON files when they go into the jar.
// The source files stay readable; only spaces/newlines outside of strings are removed.
processResources {
    doLast {
        destinationDir.eachFileRecurse(groovy.io.FileType.FILES) { File f ->
            if (!f.name.endsWith('.json')) return
            String s = f.getText('UTF-8')
            StringBuilder sb = new StringBuilder(s.length())
            boolean inStr = false
            boolean esc = false
            for (int i = 0; i < s.length(); i++) {
                char c = s.charAt(i)
                int ci = (int) c
                if (inStr) {
                    sb.append(c)
                    if (esc) esc = false
                    else if (ci == 92) esc = true
                    else if (ci == 34) inStr = false
                } else if (ci == 34) {
                    inStr = true
                    sb.append(c)
                } else if (!Character.isWhitespace(c)) {
                    sb.append(c)
                }
            }
            f.setText(sb.toString(), 'UTF-8')
        }
    }
}
