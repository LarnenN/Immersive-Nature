modLoader = "javafml"
loaderVersion = "[40,)"
license = "GPL-3.0-or-later"

[[mods]]
modId = "immersive_nature"
version = "${version}"
displayName = "Immersive Nature"
authors = "Admin; based on Immersive Weathering (Ordana, MehVahdJukaar, Keybounce), Water Erosion (13rac1), Overgrowth (ldtteam), Snow! Real Magic (Snownee), Flowing Fluids (Traben)"
credits = "Immersive Weathering (LGPL-3.0), Water Erosion (GPL-3.0), Overgrowth (GPL-3.0), Snow! Real Magic (MIT), Flowing Fluids (LGPL-3.0)"
logoFile = "icon.png"
description = '''
A living, realistic world: weathering, falling leaves, ash, water erosion and slowly overgrowing nature.
Combines Immersive Weathering, Water Erosion, Overgrowth, Snow! Real Magic and Flowing Fluids, with compatibility for Dynamic Trees.
'''

[[dependencies.immersive_nature]]
modId = "forge"
mandatory = true
versionRange = "[40,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.immersive_nature]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.immersive_nature]]
modId = "moonlight"
mandatory = true
versionRange = "[1.20-2.16.0,]"
ordering = "NONE"
side = "BOTH"

[[dependencies.immersive_nature]]
modId = "dynamictrees"
mandatory = false
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.immersive_nature]]
modId = "kiwi"
mandatory = true
versionRange = "[11, 12)"
ordering = "NONE"
side = "BOTH"

# Immersive Nature replaces these mods - having both installed would run every mechanic twice
[[dependencies.immersive_nature]]
modId = "immersive_weathering"
mandatory = false
type = "incompatible"
versionRange = "*"
ordering = "NONE"
side = "BOTH"

# Snow! Real Magic by Snownee (MIT), built into Immersive Nature.
# Keeps its own mod id so snow in existing worlds and its config stay as they are.
[[mods]]
modId = "snowrealmagic"
version = "10.7.0"
displayName = "Immersive Nature: Snow"
authors = "Snownee, minzhi, WZD (Snow! Real Magic)"
credits = "Based on Snow! Real Magic by Snownee (MIT)"
logoFile = "icon.png"
description = '''
Part of Immersive Nature: realistic snow layers that cover plants, slabs, stairs, fences and leaves.
Based on Snow! Real Magic by Snownee.
'''

[[dependencies.snowrealmagic]]
modId = "kiwi"
mandatory = true
versionRange = "[11, 12)"
ordering = "NONE"
side = "BOTH"

[modproperties.snowrealmagic]
catalogueItemIcon = "minecraft:snow_block"

# Flowing Fluids by Traben (LGPL-3.0), built into Immersive Nature.
# Keeps its own mod id so its config, commands and network packets stay as they are.
[[mods]]
modId = "flowing_fluids"
version = "1.0.8"
displayName = "Immersive Nature: Fluids"
authors = "Traben (Flowing Fluids)"
credits = "Based on Flowing Fluids by Traben (LGPL-3.0)"
logoFile = "icon.png"
description = '''
Part of Immersive Nature: realistic, mostly finite water and lava that flow level by level.
Based on Flowing Fluids by Traben.
'''

[[dependencies.flowing_fluids]]
modId = "create"
mandatory = false
versionRange = "[0.6,)"
ordering = "NONE"
side = "BOTH"

#https://github.com/CaffeineMC/lithium/wiki/Disabling-Lithium's-Mixins-using-your-mod's-fabric.mod.json-or-neoforge.mods.toml
["lithium:options"]
"mixin.world.chunk_ticking.spread_ice" = false
